# 基础镜像的仓库前缀。
#
# 这套环境访问不了 docker.io（registry-1.docker.io 直接超时），所以凡是需要
# 从网络拉取的镜像都走 DaoCloud 代理。若哪天 runner 配了 registry-mirrors
# 或能直连 Docker Hub，在 .env 里写 REGISTRY= 留空即可回到默认仓库。
# REGISTRY 的值必须带结尾斜杠（它是仓库前缀，不是主机名），所以这里写成
# ${REGISTRY:-docker.m.daocloud.io/library/} 再接镜像名，而不是另起一段路径。
services:
  postgres:
    image: ${REGISTRY:-docker.m.daocloud.io/library/}postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME:-decoration}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-decoration}
      POSTGRES_DB: ${DATABASE_DB:-decoration}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-decoration} -d ${DATABASE_DB:-decoration}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        # 和 Dockerfile 里的 ARG 默认值保持一致；集中在这里是为了让 .env 一口气改全。
        REGISTRY: ${REGISTRY:-docker.m.daocloud.io/library/}
    image: ${BACKEND_IMAGE:-wyx-decoration-backend:local}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${DATABASE_DB:-decoration}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-decoration}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-decoration}
      APP_UPLOAD_DIR: /data/uploads
      # prod profile 里 jwt-secret 没有默认值，这里不注入就会启动失败。
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required — copy .env.example to .env and set it}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      ADMIN_BOOTSTRAP_ENABLED: "false"
    volumes:
      - uploads-data:/data/uploads
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_BUSINESS_API_URL: ${VITE_BUSINESS_API_URL:-}
        REGISTRY: ${REGISTRY:-docker.m.daocloud.io/library/}
    image: ${FRONTEND_IMAGE:-wyx-decoration:local}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-4175}:4173"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4173/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # 每日 pg_dump；卷 db-backups 需要在宿主机上另行同步走（见 README）。
  db-backup:
    image: ${REGISTRY:-docker.m.daocloud.io/library/}postgres:16-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_NAME: ${DATABASE_DB:-decoration}
      DB_USER: ${DATABASE_USERNAME:-decoration}
      PGPASSWORD: ${DATABASE_PASSWORD:-decoration}
      DB_BACKUP_DIR: /backups
    volumes:
      - ./scripts/backup-postgres.sh:/usr/local/bin/backup-postgres.sh:ro
      - db-backups:/backups
    entrypoint: ["/bin/sh", "/usr/local/bin/backup-postgres.sh"]

volumes:
  postgres-data:
  uploads-data:
  db-backups:
