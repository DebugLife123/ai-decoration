            data: { $ref: '#/components/schemas/LaborQuotePage' }

    # -- shared building blocks -------------------------------------------
    BinaryFile:
      type: string
      format: binary
      description: Raw file bytes; the concrete media type is set by the response Content-Type.
    Health:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status: { type: string, enum: [UP, DOWN, OUT_OF_SERVICE, UNKNOWN] }
    HealthResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/Health' }

    # -- budgets -----------------------------------------------------------
    BudgetFinishLevel:
      type: string
      enum: [BASIC, STANDARD, PREMIUM]
    BudgetEstimateRequest:
      type: object
      required: [area]
      additionalProperties: false
      properties:
        area:
          type: number
          minimum: 1
          maximum: 2000
          description: Gross floor area in square metres.
        region:
          type: string
          maxLength: 80
          description: Restricts quotes to a region; omitted means every region.
        finishLevel:
          allOf:
            - $ref: '#/components/schemas/BudgetFinishLevel'
          default: STANDARD
          description: Defaults to STANDARD when omitted.
        spaceType:
          type: string
          maxLength: 40
          default: WHOLE_HOME
          description: Defaults to WHOLE_HOME when omitted.
        projectId:
          type: [string, 'null']
          format: uuid
          description: Optional project to attach the archived budget to.
        disabledItems:
          type: array
          description: Item keys the caller does not want, for example because no structural work is planned.
          maxItems: 40
          items: { type: string, maxLength: 40 }
        enabledItems:
          type: array
          description: Item keys forced on regardless of the default-on flag, for example structural work on an old flat.
          maxItems: 40
          items: { type: string, maxLength: 40 }
        targetBudget:
          type: [number, 'null']
          minimum: 0
          multipleOf: 0.01
          description: Planned total budget in yuan; only used for the over-budget reminder.
    BudgetQuoteSample:
      type: object
      required: [quoteId, name, price, unit, unitKind, companyName]
      additionalProperties: false
      properties:
        quoteId: { type: string, format: uuid }
        name: { type: string }
        price: { type: number }
        unit: { type: string }
        unitKind: { $ref: '#/components/schemas/UnitKind' }
        companyName: { type: string }
    BudgetItem:
      type: object
      required: [itemKey, label, unitKind, basis, quantity, appliedMinQty, wasteRate, disabled,
                 materialCostLow, materialCostHigh, laborCostLow, laborCostHigh,
                 materialPriceLow, materialPriceHigh, laborPriceLow, laborPriceHigh,
                 costLow, costHigh, source, materialSource, laborSource, skippedReasons, quoteSamples]
      additionalProperties: false
      properties:
        itemKey: { type: string }
        label: { type: string }
        unitKind:
          $ref: '#/components/schemas/UnitKind'
          description: Measurement family the planner uses to match a company quote to this section.
        basis:
          type: string
          description: How the quantity was derived, for example floor area.
        quantity: { type: number }
        appliedMinQty: { type: boolean }
        appliedMinQtyRule:
          type: [string, 'null']
          description: Populated only when appliedMinQty is true.
        wasteRate: { type: number }
        disabled: { type: boolean, description: True when the caller turned this item off. }
        materialCostLow:
          type: number
          description: Material part of this section's subtotal. materialCost + laborCost always equals cost.
        materialCostHigh: { type: number }
        laborCostLow: { type: number }
        laborCostHigh: { type: number }
        materialPriceLow:
          type: [number, 'null']
          description: >-
            Material unit price in yuan per unitKind, excluding quantity and waste. Shown so a reader can
            understand "how much per square metre"; the cost fields are authoritative and this value is
            derived from them, so it can differ from the cost by a cent from rounding.
        materialPriceHigh: { type: [number, 'null'] }
        laborPriceLow: { type: [number, 'null'] }
        laborPriceHigh: { type: [number, 'null'] }
        costLow: { type: number }
        costHigh: { type: number }
        source:
          type: string
          enum: [QUOTED, PARTIAL, REFERENCE, DISABLED]
          description: >-
            QUOTED means both the material and the labor side use real company quotes; PARTIAL means exactly
            one side does and the other falls back to the platform model; REFERENCE means neither side
            reached the company threshold; DISABLED means the caller turned it off. Material and labor are
            judged independently, so a section with material quotes but no labor quotes is PARTIAL rather
            than being dragged all the way back to REFERENCE.
        materialSource:
          type: string
          enum: [QUOTED, REFERENCE, NONE]
          description: How the material side was priced. NONE means the item is not priced at all.
        laborSource:
          type: string
          enum: [QUOTED, REFERENCE, NONE]
          description: How the labor side was priced. NONE means the item is not priced at all.
        skippedReasons:
          type: array
          description: Why this item produced no usable quote, for example an unrecognised unit.
          items: { type: string }
        quoteSamples:
          type: array
          items: { $ref: '#/components/schemas/BudgetQuoteSample' }
    BudgetEstimateResult:
      type: object
      required: [totalLow, totalHigh, overBudgetStatus, dataQuality, pricingMode, modelVersion,
                 interiorArea, wallArea, materialCostLow, materialCostHigh, laborCostLow, laborCostHigh,
                 items, warnings, generatedAt]
      additionalProperties: false
      properties:
        totalLow: { type: number }
        totalHigh: { type: number }
        targetBudget: { type: [number, 'null'] }
        overBudgetStatus:
          type: string
          enum: [OVER, WITHIN, UNDER]
          description: OVER when the target sits below totalLow, UNDER when above totalHigh, otherwise WITHIN.
        dataQuality:
          type: string
          enum: [QUOTED, PARTIAL, REFERENCE]
        pricingMode: { type: string, description: Currently LIST. }
        modelVersion:
          type: string
          description: >-
            Currently v4. Bumped from v3 when sections started pricing material and labor independently,
            because the totals of a PARTIAL estimate differ from what v3 produced for the same quotes.
        interiorArea: { type: number }
        wallArea: { type: number }
        materialCostLow: { type: number }
        materialCostHigh: { type: number }
        laborCostLow: { type: number }
        laborCostHigh: { type: number }
        items:
          type: array
          items: { $ref: '#/components/schemas/BudgetItem' }
        warnings:
          type: array
          items: { type: string }
        generatedAt: { type: string, format: date-time }
    BudgetEstimateResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/BudgetEstimateResult' }
    SavedBudget:
      type: object
      required: [id, pricingMode, modelVersion, totalLow, totalHigh, dataQuality, result, createdAt]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        projectId: { type: [string, 'null'], format: uuid }
        pricingMode: { type: string }
        modelVersion: { type: string }
        totalLow: { type: number }
        totalHigh: { type: number }
        dataQuality: { type: string, enum: [QUOTED, PARTIAL, REFERENCE] }
        result: { $ref: '#/components/schemas/BudgetEstimateResult' }
        createdAt: { type: string, format: date-time }
    SavedBudgetResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/SavedBudget' }
    SavedBudgetListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/SavedBudget' }

