      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/MaterialQuote' }
        page: { $ref: '#/components/schemas/PageMeta' }
    MaterialQuotePageResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/MaterialQuotePage' }
    LaborQuote:
      type: object
      required: [id, type, unit, price, region, validUntil, version, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid, readOnly: true }
        type: { type: string, minLength: 1, maxLength: 160 }
        unit: { type: string, minLength: 1, maxLength: 40 }
        price: { type: number, exclusiveMinimum: 0, multipleOf: 0.01 }
        region: { type: string, minLength: 1, maxLength: 80 }
        validUntil: { type: string, format: date }
        version: { type: integer, minimum: 0, readOnly: true }
        createdAt: { type: string, format: date-time, readOnly: true }
        updatedAt: { type: string, format: date-time, readOnly: true }
        unitKind: { $ref: '#/components/schemas/UnitKind' }
        unitUnknown:
          type: boolean
          description: >-
            True when the free-text unit could not be normalised. Such a quote stays visible in
            the catalog and on the company console, but clients must label it
            "单位待确认，不参与比价" and the budget engine excludes it from every roll-up.
        itemNature: { $ref: '#/components/schemas/ItemNature' }
        adminHidden:
          type: boolean
          description: True when a platform admin suppressed the quote from the public catalog.
    LaborQuoteRequest:
      type: object
