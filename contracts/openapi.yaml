        - type: object
          properties:
            data: { $ref: '#/components/schemas/BusinessCasePage' }
    UnitKind:
      type: string
      description: >-
        Normalised measurement family derived from the free-text unit a company typed in.
        UNKNOWN means the unit could not be recognised and the quote is excluded from budget maths.
      enum: [SQM, LM, PIECE, SET, PACKAGE, DAY, LM_PER_LEVEL, SQM_PER_FLOOR, LM_PER_FLOOR,
             CM_PER_SQM, SET_LM, HOUSE, ROOM, UNKNOWN]
    ItemNature:
      type: string
      description: >-
        Whether a quote already carries the matching labour. GIFT and OWNER_SUPPLIED items are
        priced but excluded from the labour roll-up.
      enum: [INCLUDED, GIFT, OWNER_SUPPLIED]
    MaterialQuote:
      type: object
      required: [id, name, spec, unit, price, category, region, validUntil, version, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid, readOnly: true }
        name: { type: string, minLength: 1, maxLength: 160 }
        spec: { type: string, minLength: 1, maxLength: 240 }
        unit: { type: string, minLength: 1, maxLength: 40 }
        price: { type: number, exclusiveMinimum: 0, multipleOf: 0.01 }
        brand: { type: [string, 'null'], maxLength: 120 }
        category: { type: string, minLength: 1, maxLength: 80 }
        region: { type: string, minLength: 1, maxLength: 80 }
        validUntil: { type: string, format: date }
        imageId: { type: [string, 'null'], format: uuid, description: Legacy single image; mirrors the first entry of imageIds. }
        imageIds:
          type: array
          maxItems: 8
          items: { type: string, format: uuid }
        version: { type: integer, minimum: 0, readOnly: true }
        createdAt: { type: string, format: date-time, readOnly: true }
        updatedAt: { type: string, format: date-time, readOnly: true }
        unitKind: { $ref: '#/components/schemas/UnitKind' }
        unitUnknown:
          type: boolean
          description: >-
            True when the free-text unit could not be normalised. The quote is still returned to
            every reader; clients must label it "单位待确认，不参与比价" and the budget engine
            excludes it from every roll-up.
        itemNature: { $ref: '#/components/schemas/ItemNature' }
    MaterialQuoteRequest:
      type: object
      required: [name, spec, unit, price, category, region, validUntil]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        spec: { type: string, minLength: 1, maxLength: 240 }
        unit: { type: string, minLength: 1, maxLength: 40 }
        price: { type: number, exclusiveMinimum: 0, multipleOf: 0.01 }
        category: { type: string, minLength: 1, maxLength: 80 }
        region: { type: string, minLength: 1, maxLength: 80 }
        validUntil: { type: string, format: date }
        imageId: { type: string, format: uuid }
        brand: { type: string, maxLength: 120 }
        imageIds:
          type: array
          maxItems: 8
          uniqueItems: true
          items: { type: string, format: uuid }
        itemNature: { $ref: '#/components/schemas/ItemNature' }
    MaterialQuotePatch:
      type: object
      required: [version]
      minProperties: 2
      additionalProperties: false
      description: Partial update; version is required and must match the last read version.
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        spec: { type: string, minLength: 1, maxLength: 240 }
        unit: { type: string, minLength: 1, maxLength: 40 }
        price: { type: number, exclusiveMinimum: 0, multipleOf: 0.01 }
        category: { type: string, minLength: 1, maxLength: 80 }
        region: { type: string, minLength: 1, maxLength: 80 }
        validUntil: { type: string, format: date }
        imageId: { type: string, format: uuid }
        clearImage: { type: boolean, description: Explicitly detach the legacy single image. }
        brand: { type: string, maxLength: 120 }
        imageIds:
          type: array
          maxItems: 8
          uniqueItems: true
          items: { type: string, format: uuid }
        itemNature: { $ref: '#/components/schemas/ItemNature' }
        version: { type: integer, minimum: 0 }
    MaterialQuoteResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/MaterialQuote' }
    MaterialQuotePage:
      type: object
