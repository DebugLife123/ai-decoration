openapi: 3.1.0
info:
  title: Decoration Business API
  version: 0.1.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: >-
    Contract for the authenticated business workspace. Company ownership is
    always derived from the bearer token; clients cannot choose a company ID.
    Tokens carry companyId and role claims. Roles are COMPANY_ADMIN,
    COMPANY_EDITOR, and COMPANY_VIEWER. Viewers are read-only; editors can
    create and update resources; only admins can delete resources or publish
    cases. Cross-company resource IDs return 404 to prevent resource discovery.
servers:
  - url: https://api.decoration.invalid
    description: Placeholder host; configure the deployment URL per environment.
security:
  - bearerAuth: []
tags:
  - name: Authentication
    description: Email and password registration and login for personal and business accounts.
  - name: Projects
    description: Full project workspace aggregates scoped to the authenticated company.
  - name: Company profile
    description: Current company's editable profile, scoped from the bearer token.
  - name: Business cases
    description: Case portfolio records owned by the authenticated company.
  - name: Material quotes
    description: Company material prices and their regional validity periods.
  - name: Labor quotes
    description: Company labor rates and their regional validity periods.
  - name: Health
    description: Anonymous liveness probe used by the container orchestrator and load balancer.
  - name: Budgets
    description: Anonymous cost estimates and the archived estimates saved per token owner.
  - name: Business assets
    description: Company-owned file library for case photos, certification documents, and quote images.
  - name: Business completeness
    description: Readiness counters that explain what a company still needs before publishing.
  - name: Style profiles
    description: Company-curated style recommendation entries and the anonymous consumer-facing list.
  - name: Inquiries
    description: Consumer consultation requests and the company inbox that triages them.
  - name: Notifications
    description: In-app notification feed shared by personal users, companies, and platform admins.
  - name: Public catalog
    description: Consumer-facing case and company pages, readable only by authenticated personal users.
  - name: Material catalog
    description: Cross-company material search used by consumers to compare regional prices.
  - name: Admin audit
    description: Platform admin view over the immutable audit trail.
  - name: Admin certifications
    description: Platform admin review queue for company certification submissions.
  - name: Admin assets
    description: Platform admin tooling for previewing and reclaiming orphaned uploaded images.
  - name: Admin marketplace
    description: Platform admin operations across companies, cases, quotes, and quote visibility.
paths:
  /api/v1/auth/register:
    post:
      security: []
      tags: [Authentication]
      operationId: registerAccount
      summary: Register a personal or business account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Account created and authenticated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/auth/login:
    post:
      security: []
      tags: [Authentication]
      operationId: login
      summary: Sign in with an email and password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Signed in and authenticated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/me:
    get:
      tags: [Authentication]
      operationId: getCurrentUser
      summary: Get the current account
      responses:
        '200':
          description: Current authenticated account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/projects:
    get:
      tags: [Projects]
      operationId: listProjects
      summary: List projects owned by the current company
      responses:
        '200':
          description: Project aggregates ordered by most recently updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Projects]
      operationId: replaceProjects
      summary: Replace the current company's complete project list
      description: Omitted projects are deleted. Prefer the single-project endpoint for routine edits.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectBatchRequest' }
      responses:
        '200':
          description: Replaced project list.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectListResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/projects/{projectId}:
    parameters:
      - name: projectId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [Projects]
      operationId: saveProject
      summary: Create or replace one project aggregate
      description: The JSON body's id is required and must match projectId.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectAggregate' }
      responses:
        '200':
          description: Saved project aggregate.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Projects]
      operationId: deleteProject
      summary: Delete one project aggregate
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/projects/{projectId}/assets:
    parameters:
      - name: projectId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Projects]
      operationId: listProjectAssets
      summary: List asset metadata for a project
      responses:
        '200':
          description: Project assets.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Projects]
      operationId: registerProjectAsset
      summary: Register an asset already stored by the configured object storage adapter
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssetRequest' }
      responses:
        '201':
          description: Registered project asset.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/projects/{projectId}/versions:
    parameters:
      - name: projectId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Projects]
      operationId: listProjectVersions
      summary: List saved versions for a project
      responses:
        '200':
          description: Versions ordered newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectHistoryListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/projects/{projectId}/tasks:
    parameters:
      - name: projectId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Projects]
      operationId: listProjectTasks
      summary: List generation tasks for a project
      responses:
        '200':
          description: Project tasks ordered newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectHistoryListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/projects/{projectId}/renders:
    post:
      tags: [Projects]
      operationId: enqueueRender
      summary: Persist a render task for asynchronous execution
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '202':
          description: Task accepted into the persistent queue.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/projects/{projectId}/edits:
    post:
      tags: [Projects]
      operationId: enqueueEdit
      summary: Persist an edit task for asynchronous execution
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '202':
          description: Task accepted into the persistent queue.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/projects/{projectId}/recommendations:
    post:
      tags: [Projects]
      operationId: enqueueRecommendation
      summary: Persist a recommendation task for asynchronous execution
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '202':
          description: Task accepted into the persistent queue.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/tasks/{taskId}:
    get:
      tags: [Projects]
      operationId: getTask
      summary: Get a task owned by the authenticated user or company
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Task state and result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/tasks/{taskId}/retry:
    post:
      tags: [Projects]
      operationId: retryFailedTask
      summary: Queue a failed task again
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Task queued, content: { application/json: { schema: { $ref: '#/components/schemas/TaskResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/tasks/claim-next:
    post:
      tags: [Projects]
      operationId: claimNextTask
      summary: Claim the next generation task (AI_WORKER only)
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskLeaseRequest' }
      responses:
        '200': { description: Claimed task or null, content: { application/json: { schema: { $ref: '#/components/schemas/TaskResponse' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/tasks/{taskId}/claim:
    post:
      tags: [Projects]
      operationId: claimTask
      summary: Claim one generation task (AI_WORKER only)
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskLeaseRequest' }
      responses:
        '200': { description: Claimed task, content: { application/json: { schema: { $ref: '#/components/schemas/TaskResponse' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/tasks/{taskId}/complete:
    post:
      tags: [Projects]
      operationId: completeTask
      summary: Complete a task and create a project version (AI_WORKER only)
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskCompletionRequest' }
      responses:
        '200': { description: Completed task, content: { application/json: { schema: { $ref: '#/components/schemas/TaskResponse' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/tasks/{taskId}/fail:
    post:
      tags: [Projects]
      operationId: failTask
      summary: Fail a task attempt and optionally retry it (AI_WORKER only)
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskFailureRequest' }
      responses:
        '200': { description: Updated task, content: { application/json: { schema: { $ref: '#/components/schemas/TaskResponse' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/business/certification:
    get:
      tags: [Company profile]
      operationId: getCompanyCertification
      summary: Get the current company's certification application
      responses:
        '200': { description: Application or null, content: { application/json: { schema: { $ref: '#/components/schemas/CertificationResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Company profile]
      operationId: submitCompanyCertification
      summary: Submit or update a certification application
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CertificationRequest' }
      responses:
        '200': { description: Submitted application, content: { application/json: { schema: { $ref: '#/components/schemas/CertificationResponse' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/VersionConflict' }
  /api/v1/business/profile:
    get:
      tags: [Company profile]
      operationId: getCompanyProfile
      summary: Get the current company's profile
      responses:
        '200':
          description: Profile or null when the company has not created one yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyProfileResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      tags: [Company profile]
      operationId: replaceCompanyProfile
      summary: Create or replace the current company's profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyProfileRequest'
      responses:
        '200':
          description: Saved profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyProfileResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/business/cases:
    get:
      tags: [Business cases]
      operationId: listBusinessCases
      summary: List cases owned by the current company
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/CaseStatus'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Page of cases; an empty result is still 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessCasePageResponse'
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Business cases]
      operationId: createBusinessCase
      summary: Create a case draft
      description: >-
        Creation always produces a draft. Sending status=published is rejected with 400
        VALIDATION_ERROR; use POST /business/cases/{caseId}/publish instead, so that
        publishing stays a separately audited, certification-checked step.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessCaseRequest'
      responses:
        '201':
          description: Created case
          headers:
            Location:
              schema: { type: string, format: uri-reference }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessCaseResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/business/cases/{caseId}:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    get:
      tags: [Business cases]
      operationId: getBusinessCase
      summary: Get one case owned by the current company
      responses:
        '200':
          description: Case
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessCaseResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [Business cases]
      operationId: updateBusinessCase
      summary: Update fields on a case
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessCasePatch'
      responses:
        '200':
          description: Updated case
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessCaseResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Business cases]
      operationId: deleteBusinessCase
      summary: Delete a case
      parameters:
        - name: version
          in: query
          required: true
          schema: { type: integer, minimum: 0 }
      responses:
        '204': { description: Deleted; repeating the delete returns 404 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/business/material-quotes:
    get:
      tags: [Material quotes]
      operationId: listMaterialQuotes
      summary: List material quotes owned by the current company
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: region
          in: query
          schema: { type: string, maxLength: 80 }
        - name: category
          in: query
          schema: { type: string, maxLength: 80 }
        - name: includeExpired
          in: query
          description: Defaults to false; expired quotes are hidden from normal lists.
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Page of material quotes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialQuotePageResponse'
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Material quotes]
      operationId: createMaterialQuote
      summary: Create a material quote
      description: >-
        A company keeps one row per name/spec/brand/unit combination. Repeating an
        existing combination returns 409 DUPLICATE_QUOTE; edit that row instead.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaterialQuoteRequest'
      responses:
        '201':
          description: Created material quote
          headers:
            Location:
              schema: { type: string, format: uri-reference }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialQuoteResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/business/material-quotes/{quoteId}:
    parameters:
      - $ref: '#/components/parameters/QuoteId'
    get:
      tags: [Material quotes]
      operationId: getMaterialQuote
      summary: Get one material quote owned by the current company
      responses:
        '200':
          description: Material quote
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialQuoteResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [Material quotes]
      operationId: updateMaterialQuote
      summary: Update a material quote
      description: >-
        Renaming or re-unit-ing a quote onto another existing name/spec/brand/unit
        combination returns 409 DUPLICATE_QUOTE.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaterialQuotePatch'
      responses:
        '200':
          description: Updated material quote
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialQuoteResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Material quotes]
      operationId: deleteMaterialQuote
      summary: Delete a material quote
      parameters:
        - name: version
          in: query
          required: true
          schema: { type: integer, minimum: 0 }
      responses:
        '204': { description: Deleted; repeating the delete returns 404 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/business/labor-quotes:
    get:
      tags: [Labor quotes]
      operationId: listLaborQuotes
      summary: List labor quotes owned by the current company
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: region
          in: query
          schema: { type: string, maxLength: 80 }
        - name: includeExpired
          in: query
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Page of labor quotes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LaborQuotePageResponse'
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Labor quotes]
      operationId: createLaborQuote
      summary: Create a labor quote
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LaborQuoteRequest'
      responses:
        '201':
          description: Created labor quote
          headers:
            Location:
              schema: { type: string, format: uri-reference }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LaborQuoteResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/business/labor-quotes/{quoteId}:
    parameters:
      - $ref: '#/components/parameters/QuoteId'
    get:
      tags: [Labor quotes]
      operationId: getLaborQuote
      summary: Get one labor quote owned by the current company
      responses:
        '200':
          description: Labor quote
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LaborQuoteResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [Labor quotes]
      operationId: updateLaborQuote
      summary: Update a labor quote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LaborQuotePatch'
      responses:
        '200':
          description: Updated labor quote
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LaborQuoteResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Labor quotes]
      operationId: deleteLaborQuote
      summary: Delete a labor quote
      parameters:
        - name: version
          in: query
          required: true
          schema: { type: integer, minimum: 0 }
      responses:
        '204': { description: Deleted; repeating the delete returns 404 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ---------------------------------------------------------------------------
  # Public entry points: reachable without a bearer token by design.
  # ---------------------------------------------------------------------------
  /api/v1/auth/admin/login:
    post:
      security: []
      tags: [Authentication]
      operationId: adminLogin
      summary: Sign in as a platform administrator
      description: >-
        Accepts the same body as login but only issues a token for accounts whose
        role is PLATFORM_ADMIN. A valid non-admin account and a wrong password both
        return 401 INVALID_CREDENTIALS so the endpoint does not disclose which
        accounts exist.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Signed in as a platform administrator.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/health:
    get:
      security: []
      tags: [Health]
      operationId: getHealth
      summary: Aggregate liveness and readiness status
      description: >-
        Unauthenticated probe endpoint. Only the aggregate status code is returned;
        component details stay behind actuator authorization.
      responses:
        '200':
          description: Aggregate health status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/styles/recommendations:
    get:
      security: []
      tags: [Style profiles]
      operationId: listStyleRecommendations
      summary: List published style profiles across certified companies
      description: >-
        Anonymous on purpose: the budget page shows style recommendations before
        sign-in. Ranking by budget, area, and region happens in the client; this
        endpoint only supplies the candidate set.
      responses:
        '200':
          description: Candidate style profiles with their company attribution.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecommendationProfileListResponse' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/budgets/estimate:
    post:
      security: []
      tags: [Budgets]
      operationId: estimateBudget
      summary: Estimate a renovation budget from the platform price model
      description: >-
        Computed from published material and labor quotes of certified companies.
        Nothing is persisted; use POST /budgets to archive the result.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BudgetEstimateRequest' }
      responses:
        '200':
          description: Estimate result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BudgetEstimateResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ---------------------------------------------------------------------------
  # Budgets: archived estimates scoped to the token's owner.
  # ---------------------------------------------------------------------------
  /api/v1/budgets:
    post:
      tags: [Budgets]
      operationId: saveBudget
      summary: Estimate and archive a budget under the current owner
      description: >-
        Runs the same computation as /budgets/estimate and stores the result. The
        owner is the token's companyId, or the subject when the token carries no
        company claim.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BudgetEstimateRequest' }
      responses:
        '201':
          description: Archived budget.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedBudgetResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '500': { $ref: '#/components/responses/InternalError' }
    get:
      tags: [Budgets]
      operationId: listBudgets
      summary: List archived budgets for the current owner
      parameters:
        - name: projectId
          in: query
          description: Restrict the listing to one project.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Archived budgets, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedBudgetListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/budgets/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Budgets]
      operationId: getBudget
      summary: Get one archived budget owned by the current owner
      responses:
        '200':
          description: Archived budget.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedBudgetResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Budgets]
      operationId: deleteBudget
      summary: Delete one archived budget
      responses:
        '204': { description: Deleted; repeating the delete returns 404 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------------------
  # Business asset library: images and PDFs owned by the current company.
  # ---------------------------------------------------------------------------
  /api/v1/business/assets:
    post:
      tags: [Business assets]
      operationId: uploadBusinessAsset
      summary: Upload an image or PDF into the current company's asset library
      description: >-
        The stored media type is derived from the file extension and must resolve to
        image/jpeg, image/png, image/webp, image/gif, image/bmp, or application/pdf.
        A declared content type that disagrees with the resolved one returns 415.
        Files above 15 MiB return 413 FILE_TOO_LARGE.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              additionalProperties: false
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: Stored asset metadata.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BusinessAssetResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/business/assets/{assetId}:
    parameters:
      - name: assetId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Business assets]
      operationId: downloadBusinessAsset
      summary: Download one asset owned by the current company
      description: Served as an attachment with Content-Disposition and no caching.
      responses:
        '200':
          description: Raw asset bytes.
          content:
            application/octet-stream:
              schema: { $ref: '#/components/schemas/BinaryFile' }
            image/png:
              schema: { $ref: '#/components/schemas/BinaryFile' }
            image/jpeg:
              schema: { $ref: '#/components/schemas/BinaryFile' }
            image/webp:
              schema: { $ref: '#/components/schemas/BinaryFile' }
            application/pdf:
              schema: { $ref: '#/components/schemas/BinaryFile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Business assets]
      operationId: deleteBusinessAsset
      summary: Delete one asset owned by the current company
      description: Assets still referenced by a case, profile, certification, or quote are rejected with 409.
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/business/assets/public/materials/{quoteId}/images/{imageId}:
    parameters:
      - $ref: '#/components/parameters/QuoteId'
      - name: imageId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Business assets]
      operationId: getPublicMaterialImage
      summary: Read one image attached to a publicly visible material quote
      description: >-
        Readable by consumers and by the owning company. Only images of quotes from
        certified companies that are neither admin-hidden nor expired are served.
      responses:
        '200':
          description: Raw image bytes.
          content:
            image/png:
              schema: { $ref: '#/components/schemas/BinaryFile' }
            image/jpeg:
              schema: { $ref: '#/components/schemas/BinaryFile' }
            image/webp:
              schema: { $ref: '#/components/schemas/BinaryFile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------------------
  # Business workspace additions.
  # ---------------------------------------------------------------------------
  /api/v1/business/completeness:
    get:
      tags: [Business completeness]
      operationId: getBusinessCompleteness
      summary: Get the profile-completeness checklist for the current company
      description: Drives the onboarding checklist; every counter is a plain count, never a percentage.
      responses:
        '200':
          description: Completeness counters.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompletenessResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/business/cases/{caseId}/publish:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    post:
      tags: [Business cases]
      operationId: publishBusinessCase
      summary: Publish a draft case to the public catalog
      description: >-
        Publishing moves the case out of draft so it appears in /api/v1/cases.
        Requires the current version; a stale version returns 409 VERSION_CONFLICT.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublishCaseRequest' }
      responses:
        '200':
          description: Published case.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BusinessCaseResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/business/style-profiles:
    get:
      tags: [Style profiles]
      operationId: getStyleProfiles
      summary: Get the current company's style profile set
      description: Returns an empty profile list with version 0 when nothing has been saved yet.
      responses:
        '200':
          description: Style profile set with its optimistic-lock version.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyStyleProfileResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      tags: [Style profiles]
      operationId: replaceStyleProfiles
      summary: Replace the current company's complete style profile set
      description: Omitted profiles are removed. At most 30 profiles are accepted.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StyleProfileUpdateRequest' }
      responses:
        '200':
          description: Replaced style profile set.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyStyleProfileResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ---------------------------------------------------------------------------
  # Inquiries: consumer questions routed to the owning company.
  # ---------------------------------------------------------------------------
  /api/v1/inquiries:
    post:
      tags: [Inquiries]
      operationId: createInquiry
      summary: Ask a company about one of its published material quotes
      description: >-
        The company is derived from the quote, never from the body. Quotes that are
        admin-hidden, expired, or owned by an uncertified company return 404 so the
        caller cannot probe which companies exist.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateInquiryRequest' }
      responses:
        '201':
          description: Created inquiry.
          headers:
            Location:
              schema: { type: string, format: uri-reference }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyInquiryResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }

  /api/v1/business/inquiries:
    get:
      tags: [Inquiries]
      operationId: listCompanyInquiries
      summary: List inquiries received by the current company
      description: Unpaginated; the server caps the result at the 500 most recent inquiries.
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/InquiryStatus' }
      responses:
        '200':
          description: Received inquiries, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyInquiryListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/business/inquiries/{inquiryId}/status:
    parameters:
      - name: inquiryId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Inquiries]
      operationId: updateInquiryStatus
      summary: Move an inquiry through the NEW to CONTACTED to QUOTED to CLOSED pipeline
      description: >-
        Transitions are one-way and must not skip a step. Jumping ahead, going backwards,
        or re-setting the current status returns 409 INVALID_STATUS_TRANSITION; a stale
        version returns 409 VERSION_CONFLICT.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateInquiryStatusRequest' }
      responses:
        '200':
          description: Updated inquiry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyInquiryResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Stale version, or a status transition outside the allowed pipeline.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ---------------------------------------------------------------------------
  # Notifications: derived, not stored. The list is recomputed per request.
  # ---------------------------------------------------------------------------
  /api/v1/notifications:
    get:
      tags: [Notifications]
      operationId: listNotifications
      summary: List notifications visible to the current principal
      description: >-
        The recipient role is taken from the token: PLATFORM_ADMIN sees ADMIN
        notifications, any COMPANY_* role sees BUSINESS notifications, everything
        else sees PERSONAL ones.
      responses:
        '200':
          description: Notifications, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/notifications/{key}/read:
    parameters:
      - name: key
        in: path
        required: true
        description: Opaque notification key as returned by the list endpoint.
        schema: { type: string, maxLength: 255 }
    patch:
      tags: [Notifications]
      operationId: markNotificationRead
      summary: Mark one notification as read for the current principal
      responses:
        '200':
          description: Marked read. The envelope data is null.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/notifications/read-all:
    post:
      tags: [Notifications]
      operationId: markAllNotificationsRead
      summary: Mark every visible notification as read for the current principal
      responses:
        '200':
          description: Marked read. The envelope data is null.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ---------------------------------------------------------------------------
  # Public catalog for consumers.
  # ---------------------------------------------------------------------------
  /api/v1/cases:
    get:
      tags: [Public catalog]
      operationId: listPublicCases
      summary: Search and page through published cases
      description: >-
        Only cases with status published that belong to a certified company are
        returned. All filters are optional and combined with AND.
      parameters:
        - name: query
          in: query
          description: Case-insensitive match on the title.
          schema: { type: string, maxLength: 120 }
        - name: style
          in: query
          schema: { type: string, maxLength: 80 }
        - name: city
          in: query
          schema: { type: string, maxLength: 80 }
        - name: minArea
          in: query
          schema: { type: number, minimum: 0 }
        - name: maxArea
          in: query
          schema: { type: number, minimum: 0 }
        - name: minBudget
          in: query
          schema: { type: number, minimum: 0 }
        - name: maxBudget
          in: query
          schema: { type: number, minimum: 0 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 24 }
      responses:
        '200':
          description: Page of published cases.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicCasePageResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/cases/{caseId}/files/{fileId}:
    parameters:
      - $ref: '#/components/parameters/CaseId'
      - name: fileId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Public catalog]
      operationId: getPublicCaseFile
      summary: Read one image attached to a published case
      responses:
        '200':
          description: Raw image bytes, served inline.
          content:
            image/png:
              schema: { $ref: '#/components/schemas/BinaryFile' }
            image/jpeg:
              schema: { $ref: '#/components/schemas/BinaryFile' }
            image/webp:
              schema: { $ref: '#/components/schemas/BinaryFile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/companies/{companyId}:
    parameters:
      - name: companyId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Public catalog]
      operationId: getPublicCompany
      summary: Read the public storefront page of one certified company
      description: >-
        Only approved companies are exposed. Private fields such as account emails
        and internal certification notes are never included.
      responses:
        '200':
          description: Public company profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicCompanyResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/companies/{companyId}/assets/{assetId}:
    parameters:
      - name: companyId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: assetId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Public catalog]
      operationId: getPublicCompanyAsset
      summary: Read a logo or storefront image of a certified company
      responses:
        '200':
          description: Raw image bytes, served inline.
          content:
            image/png:
              schema: { $ref: '#/components/schemas/BinaryFile' }
            image/jpeg:
              schema: { $ref: '#/components/schemas/BinaryFile' }
            image/webp:
              schema: { $ref: '#/components/schemas/BinaryFile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/materials:
    get:
      tags: [Material catalog]
      operationId: listMaterialCatalog
      summary: Browse material quotes from certified companies
      description: >-
        Readable by every signed-in role, including PLATFORM_ADMIN in read-only preview
        mode. Only quotes from approved companies that are neither admin-hidden nor
        expired appear; includeExpired is a convenience for the seller's own
        verification, not a way to reach hidden quotes.
      parameters:
        - name: region
          in: query
          schema: { type: string, maxLength: 80 }
        - name: category
          in: query
          schema: { type: string, maxLength: 80 }
        - name: query
          in: query
          description: Case-insensitive match on name, brand, or specification.
          schema: { type: string, maxLength: 120 }
        - name: includeExpired
          in: query
          schema: { type: boolean, default: false }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Page of catalog materials.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogMaterialPageResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ---------------------------------------------------------------------------
  # Platform administration. Every operation below requires PLATFORM_ADMIN.
  # ---------------------------------------------------------------------------
  /api/v1/admin/audit-logs:
    get:
      tags: [Admin audit]
      operationId: listAuditLogs
      summary: Page through the platform audit trail
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: action
          in: query
          description: Exact match on the action code, for example IMAGE_CLEANUP.
          schema: { type: string, maxLength: 60 }
      responses:
        '200':
          description: Page of audit entries, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditLogPageResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/admin/certifications:
    get:
      tags: [Admin certifications]
      operationId: listAdminCertifications
      summary: List certification applications across companies
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/CertificationStatus' }
        - name: query
          in: query
          description: Case-insensitive match on company name or account email.
          schema: { type: string, maxLength: 120 }
        - name: kind
          in: query
          description: Restrict to real or demo companies. Defaults to ALL.
          schema: { type: string, enum: [ALL, REAL, DEMO], default: ALL }
      responses:
        '200':
          description: Certification applications, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminCertificationListResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/admin/certifications/{companyId}/review:
    parameters:
      - name: companyId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Admin certifications]
      operationId: reviewCertificationAsAdmin
      summary: Approve or reject a company certification application
      description: >-
        The reviewer identity comes from the token subject and is recorded in the
        audit trail. A stale version returns 409 VERSION_CONFLICT.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CertificationDecision' }
      responses:
        '200':
          description: Reviewed certification.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CertificationResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/admin/certifications/{companyId}/documents/{assetId}:
    parameters:
      - name: companyId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: assetId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Admin certifications]
      operationId: getCertificationDocument
      summary: Read one document attached to a certification application
      responses:
        '200':
          description: Raw document bytes, served inline.
          content:
            application/pdf:
              schema: { $ref: '#/components/schemas/BinaryFile' }
            image/png:
              schema: { $ref: '#/components/schemas/BinaryFile' }
            image/jpeg:
              schema: { $ref: '#/components/schemas/BinaryFile' }
            image/webp:
              schema: { $ref: '#/components/schemas/BinaryFile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/assets/cleanup-preview:
    get:
      tags: [Admin assets]
      operationId: previewAssetCleanup
      summary: Preview images that have been unreferenced for at least seven days
      description: >-
        Read-only. The preview lists orphaned image assets with their sizes so an
        operator can decide what to remove; nothing is deleted here.
      responses:
        '200':
          description: Cleanup preview.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CleanupPreviewResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/admin/assets/cleanup:
    post:
      tags: [Admin assets]
      operationId: cleanupAssets
      summary: Delete a selected batch of unreferenced images
      description: >-
        Only assets that are still unreferenced and older than seven days are
        removed; anything else is skipped silently. A batch is capped at the server's
        batch size, and an oversized or empty selection removes nothing. Each
        successful run is written to the audit trail.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CleanupRequest' }
      responses:
        '200':
          description: Number of images actually removed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CleanupResultResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/admin/assets/cleanup-preview/{assetId}/image:
    parameters:
      - name: assetId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Admin assets]
      operationId: getCleanupPreviewImage
      summary: Render one image listed in the cleanup preview
      responses:
        '200':
          description: Raw image bytes, served inline.
          content:
            image/png:
              schema: { $ref: '#/components/schemas/BinaryFile' }
            image/jpeg:
              schema: { $ref: '#/components/schemas/BinaryFile' }
            image/webp:
              schema: { $ref: '#/components/schemas/BinaryFile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/marketplace/companies/import:
    post:
      tags: [Admin marketplace]
      operationId: importCompany
      summary: Create a company account together with draft cases and material quotes
      description: >-
        Onboarding shortcut for migrating an existing client. The company is created
        approved, cases land as drafts, and quotes are published. All three
        collections must be present even when empty.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompanyImportRequest' }
      responses:
        '201':
          description: Imported company summary.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyImportResultResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/admin/marketplace/companies/{companyId}:
    parameters:
      - name: companyId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Admin marketplace]
      operationId: getAdminCompanyDetail
      summary: Read every business record a company owns
      description: >-
        The consolidated view used by the admin console: certification, profile,
        style profile, cases, quotes, and assets in one response.
      responses:
        '200':
          description: Company detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminCompanyDetailResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/admin/marketplace/companies/{companyId}/assets:
    parameters:
      - name: companyId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Admin marketplace]
      operationId: uploadCompanyAsset
      summary: Upload an image or PDF on behalf of a company
      description: Same media-type and size rules as the company's own asset upload.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              additionalProperties: false
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: Stored asset metadata.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BusinessAssetResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }

  /api/v1/admin/marketplace/companies/{companyId}/assets/{assetId}:
    parameters:
      - name: companyId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: assetId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Admin marketplace]
      operationId: getAdminCompanyAsset
      summary: Read one asset of any company
      responses:
        '200':
          description: Raw asset bytes, served inline.
          content:
            application/octet-stream:
              schema: { $ref: '#/components/schemas/BinaryFile' }
            image/png:
              schema: { $ref: '#/components/schemas/BinaryFile' }
            image/jpeg:
              schema: { $ref: '#/components/schemas/BinaryFile' }
            application/pdf:
              schema: { $ref: '#/components/schemas/BinaryFile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/marketplace/companies/{companyId}/cases/{caseId}/files:
    parameters:
      - name: companyId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - $ref: '#/components/parameters/CaseId'
    post:
      tags: [Admin marketplace]
      operationId: attachCompanyCaseFiles
      summary: Replace the image list of a company case
      description: The full ordered list replaces whatever was attached before; at most 30 files.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CaseFilesRequest' }
      responses:
        '200':
          description: Attached. The envelope data is null.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiEnvelope' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/marketplace/companies/{companyId}/material-quotes/{quoteId}/images:
    parameters:
      - name: companyId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - $ref: '#/components/parameters/QuoteId'
    post:
      tags: [Admin marketplace]
      operationId: attachMaterialQuoteImages
      summary: Replace the image list of a company material quote
      description: The full ordered list replaces whatever was attached before; at most 8 images.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MaterialImagesRequest' }
      responses:
        '200':
          description: Attached. The envelope data is null.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiEnvelope' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/marketplace/material-quotes:
    get:
      tags: [Admin marketplace]
      operationId: listAdminMaterialQuotes
      summary: List material quotes across all companies with visibility metadata
      parameters:
        - name: query
          in: query
          description: Case-insensitive match on name or company name.
          schema: { type: string, maxLength: 120 }
        - name: visibility
          in: query
          description: >-
            ALL returns everything; PUBLISHED skips admin-hidden and expired quotes;
            HIDDEN returns admin-hidden quotes only; EXPIRED returns expired quotes
            that are not hidden.
          schema: { type: string, enum: [ALL, PUBLISHED, HIDDEN, EXPIRED], default: ALL }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Page of quotes with their company and certification status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminQuotePageResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/admin/marketplace/material-quotes/{quoteId}/visibility:
    parameters:
      - $ref: '#/components/parameters/QuoteId'
    patch:
      tags: [Admin marketplace]
      operationId: setMaterialQuoteVisibility
      summary: Hide or restore a material quote in the consumer catalog
      description: >-
        Hiding removes the quote from /api/v1/materials and from public company pages
        immediately. The change is written to the audit trail with the admin identity.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MaterialVisibilityRequest' }
      responses:
        '200':
          description: Updated quote.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminQuoteResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      name: page
      in: query
      description: One-based page number.
      schema: { type: integer, minimum: 1, default: 1 }
    Size:
      name: size
      in: query
      description: Maximum page size.
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Sort:
      name: sort
      in: query
      description: Stable allow-listed sort expression.
      schema: { type: string, default: updatedAt, maxLength: 40 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated key retained for at least 24 hours.
      schema: { type: string, minLength: 8, maxLength: 128 }
    CaseId:
      name: caseId
      in: path
      required: true
      schema: { type: string, format: uuid }
    QuoteId:
      name: quoteId
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    RegisterRequest:
      type: object
      required: [email, password, displayName, accountType]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        password: { type: string, minLength: 8, maxLength: 128, writeOnly: true }
        displayName: { type: string, minLength: 1, maxLength: 120 }
        accountType: { type: string, enum: [PERSONAL, BUSINESS] }
        companyName: { type: string, maxLength: 160, description: Required for BUSINESS accounts. }
      additionalProperties: false
    LoginRequest:
      type: object
      required: [email, password, accountType]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        password: { type: string, maxLength: 128, writeOnly: true }
        accountType: { type: string, enum: [PERSONAL, BUSINESS] }
      additionalProperties: false
    AuthUser:
      type: object
      required: [id, email, displayName, accountType, role]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        accountType: { type: string, enum: [personal, business] }
        companyId: { type: string, format: uuid, nullable: true }
        role: { type: string }
    AuthResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data:
              type: object
              required: [accessToken, expiresInSeconds, user]
              properties:
                accessToken: { type: string }
                expiresInSeconds: { type: integer }
                user: { $ref: '#/components/schemas/AuthUser' }
    UserResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/AuthUser' }
    ProjectAggregate:
      type: object
      required: [id]
      description: The current frontend Project object. Additional fields are preserved in JSONB.
      properties:
        id: { type: string, format: uuid }
      additionalProperties: true
    ProjectBatchRequest:
      type: object
      required: [projects]
      additionalProperties: false
      properties:
        projects:
          type: array
          items: { $ref: '#/components/schemas/ProjectAggregate' }
    ProjectResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/ProjectAggregate' }
    ProjectListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/ProjectAggregate' }
    ProjectHistoryListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data:
              type: array
              items: { type: object, additionalProperties: true }
    AssetRequest:
      type: object
      required: [originalName, mediaType, byteSize, objectKey]
      additionalProperties: false
      properties:
        originalName: { type: string, minLength: 1, maxLength: 255 }
        mediaType: { type: string, minLength: 1, maxLength: 120 }
        byteSize: { type: integer, minimum: 1 }
        objectKey: { type: string, minLength: 1, maxLength: 2000, description: Must be prefixed by ownerId/projectId/. }
        checksumSha256: { type: [string, 'null'], minLength: 64, maxLength: 64 }
    Asset:
      type: object
      required: [id, projectId, originalName, mediaType, byteSize, objectKey, createdAt]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        originalName: { type: string }
        mediaType: { type: string }
        byteSize: { type: integer }
        objectKey: { type: string }
        checksumSha256: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
    AssetResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/Asset' }
    AssetListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/Asset' }
    TaskResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data:
              type: object
              required: [id, projectId, taskType, status]
              additionalProperties: true
              properties:
                id: { type: string, format: uuid }
                projectId: { type: string, format: uuid }
                taskType: { type: string, enum: [RENDER, EDIT, RECOMMENDATION] }
                status: { type: string, enum: [QUEUED, RUNNING, SUCCEEDED, FAILED] }
    TaskLeaseRequest:
      type: object
      additionalProperties: false
      properties:
        leaseSeconds: { type: integer, minimum: 30, maximum: 3600, default: 300 }
    TaskCompletionRequest:
      type: object
      required: [result]
      additionalProperties: false
      properties:
        result: { type: object, additionalProperties: true }
        snapshot: { type: object, additionalProperties: true }
    TaskFailureRequest:
      type: object
      required: [retryable]
      additionalProperties: false
      properties:
        error: { type: [string, 'null'], maxLength: 1000 }
        retryable: { type: boolean }
    CertificationRequest:
      type: object
      required: [companyName, contactName, contactInfo, serviceAreas, documentRefs]
      additionalProperties: false
      properties:
        companyName: { type: string, minLength: 1, maxLength: 160 }
        contactName: { type: string, minLength: 1, maxLength: 120 }
        contactInfo: { type: string, minLength: 1, maxLength: 160 }
        serviceAreas: { type: array, maxItems: 20, items: { type: string, minLength: 1, maxLength: 80 } }
        documentRefs: { type: array, maxItems: 30, items: { type: string, minLength: 1, maxLength: 2000 } }
        version: { type: integer, minimum: 0, description: Required when updating an existing application. }
    CertificationDecision:
      type: object
      required: [status, version]
      additionalProperties: false
      properties:
        status: { type: string, enum: [APPROVED, REJECTED] }
        reviewNote: { type: [string, 'null'], maxLength: 1000 }
        version: { type: integer, minimum: 0 }
    CertificationResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data:
              anyOf:
                - $ref: '#/components/schemas/CertificationRecord'
                - type: 'null'
    ApiEnvelope:
      type: object
      required: [code, message, data, timestamp]
      additionalProperties: false
      properties:
        code: { type: string, example: OK }
        message: { type: string, example: success }
        data: {}
        timestamp: { type: string, format: date-time }
    ErrorResponse:
      type: object
      required: [code, message, data, timestamp]
      additionalProperties: false
      properties:
        code:
          type: string
          enum: [INVALID_REQUEST, VALIDATION_ERROR, UNAUTHORIZED, FORBIDDEN, NOT_FOUND, CONFLICT, IDEMPOTENCY_CONFLICT, VERSION_CONFLICT, INVALID_STATUS_TRANSITION, DUPLICATE_QUOTE, UNSUPPORTED_MEDIA_TYPE, FILE_TOO_LARGE, INTERNAL_ERROR]
          description: >-
            INVALID_STATUS_TRANSITION marks an inquiry status change that skips a step or goes
            backwards. DUPLICATE_QUOTE marks a material quote that repeats an existing company
            name/spec/brand/unit combination.
        message: { type: string, maxLength: 500 }
        data: { type: 'null' }
        timestamp: { type: string, format: date-time }
    PageMeta:
      type: object
      required: [page, size, total, totalPages]
      additionalProperties: false
      properties:
        page: { type: integer, minimum: 1 }
        size: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
    CompanyProfile:
      type: object
      required: [id, name, city, services, intro, version, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid, readOnly: true }
        name: { type: string, minLength: 1, maxLength: 160 }
        city: { type: string, maxLength: 80 }
        services: { type: string, maxLength: 500 }
        intro: { type: string, maxLength: 2000 }
        publicContactName: { type: [string, 'null'], maxLength: 120 }
        publicContactInfo: { type: [string, 'null'], maxLength: 160 }
        serviceAreas: { type: [string, 'null'], maxLength: 500, description: Comma-separated list surfaced on the public company page. }
        businessHours: { type: [string, 'null'], maxLength: 240 }
        logoAssetId: { type: [string, 'null'], format: uuid }
        storefrontAssetId: { type: [string, 'null'], format: uuid }
        version: { type: integer, minimum: 0, readOnly: true }
        createdAt: { type: string, format: date-time, readOnly: true }
        updatedAt: { type: string, format: date-time, readOnly: true }
    CompanyProfileRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        city: { type: string, maxLength: 80 }
        services: { type: string, maxLength: 500 }
        intro: { type: string, maxLength: 2000 }
        publicContactName: { type: string, maxLength: 120 }
        publicContactInfo: { type: string, maxLength: 160 }
        serviceAreas: { type: string, maxLength: 500 }
