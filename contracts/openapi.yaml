            data:
              type: array
              items: { $ref: '#/components/schemas/Notification' }

    # -- public catalog ----------------------------------------------------
    PublicCaseFile:
      type: object
      required: [id, fileName, mediaType]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        fileName: { type: string }
        mediaType: { type: string }
    PublicCase:
      type: object
      required: [id, title, files, updatedAt]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        area: { type: [number, 'null'] }
        style: { type: [string, 'null'] }
        budget: { type: [number, 'null'] }
        companyId: { type: [string, 'null'], format: uuid }
        companyName: { type: [string, 'null'] }
        city: { type: [string, 'null'] }
        services: { type: [string, 'null'] }
        files:
          type: array
          items: { $ref: '#/components/schemas/PublicCaseFile' }
        updatedAt: { type: string, format: date-time }
    PublicCasePage:
      type: object
      required: [items, page]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PublicCase' }
        page: { $ref: '#/components/schemas/PageMeta' }
    PublicCasePageResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/PublicCasePage' }
    PublicCompany:
      type: object
      required: [companyId, name, caseCount, materialCount, certificationStatus]
      additionalProperties: false
      properties:
        companyId: { type: string, format: uuid }
        name: { type: [string, 'null'] }
        city: { type: [string, 'null'] }
        services: { type: [string, 'null'] }
        intro: { type: [string, 'null'] }
        serviceAreas:
          type: array
          items: { type: string }
        businessHours: { type: [string, 'null'] }
        publicContactName: { type: [string, 'null'] }
        publicContactInfo: { type: [string, 'null'] }
        logoAssetId: { type: [string, 'null'], format: uuid }
        storefrontAssetId: { type: [string, 'null'], format: uuid }
        caseCount: { type: integer, minimum: 0 }
        materialCount: { type: integer, minimum: 0 }
        certificationStatus: { $ref: '#/components/schemas/CertificationStatus' }
        updatedAt: { type: [string, 'null'], format: date-time }
    PublicCompanyResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/PublicCompany' }

    # -- material catalog --------------------------------------------------
    CatalogMaterial:
      type: object
      required: [id, companyId, name, spec, unit, price, category, region, validUntil, updatedAt]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        companyId: { type: string, format: uuid }
        companyName: { type: [string, 'null'] }
        companyContactName: { type: [string, 'null'] }
        companyContactInfo: { type: [string, 'null'] }
        name: { type: string }
        spec: { type: string }
        unit: { type: string }
        price: { type: number, exclusiveMinimum: 0 }
        brand: { type: [string, 'null'] }
        category: { type: string }
        region: { type: string }
        validUntil: { type: string, format: date }
        imageId: { type: [string, 'null'], format: uuid, description: Legacy single image; prefer imageIds. }
        imageIds:
          type: array
          items: { type: string, format: uuid }
        updatedAt: { type: string, format: date-time }
        unitKind: { $ref: '#/components/schemas/UnitKind' }
        unitUnknown:
          type: boolean
          description: >-
            True when the free-text unit could not be normalised. Listing clients must label the
            quote "单位待确认，不参与比价"; it never enters the budget roll-up.
        itemNature: { $ref: '#/components/schemas/ItemNature' }
    CatalogMaterialPage:
      type: object
      required: [items, page]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CatalogMaterial' }
        page: { $ref: '#/components/schemas/PageMeta' }
    CatalogMaterialPageResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/CatalogMaterialPage' }

    # -- admin: audit ------------------------------------------------------
    AuditEntry:
      type: object
      required: [id, actorId, action, targetType, createdAt]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        actorId: { type: string, format: uuid }
        actorEmail: { type: [string, 'null'] }
        action:
          type: string
          description: Stable action code, for example IMAGE_CLEANUP or CERTIFICATION_REVIEW.
        targetType: { type: string }
        targetId: { type: [string, 'null'], format: uuid }
        description: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
    AuditLogPage:
      type: object
      required: [items, page, size, total, totalPages]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AuditEntry' }
        page: { type: integer, minimum: 1 }
        size: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
    AuditLogPageResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/AuditLogPage' }

    # -- admin: certifications ---------------------------------------------
    CertificationStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED]
    AdminCertification:
      type: object
      required: [companyId, demo, certification]
      additionalProperties: false
      properties:
        companyId: { type: string, format: uuid }
        registeredCompanyName: { type: [string, 'null'] }
        accountEmail: { type: [string, 'null'] }
        demo: { type: boolean, description: True for seeded demonstration companies. }
        certification:
          anyOf:
            - $ref: '#/components/schemas/CertificationRecord'
            - type: 'null'
    AdminCertificationListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/AdminCertification' }
    CertificationRecord:
      type: object
      required: [id, companyName, contactName, contactInfo, serviceAreas, documentRefs, status, version, submittedAt, updatedAt]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        companyName: { type: string }
        contactName: { type: string }
        contactInfo: { type: string }
        serviceAreas:
          type: array
          items: { type: string }
        documentRefs:
          type: array
          items: { type: string }
        status: { $ref: '#/components/schemas/CertificationStatus' }
        reviewNote: { type: [string, 'null'] }
        reviewedBy: { type: [string, 'null'], format: uuid }
        reviewedAt: { type: [string, 'null'], format: date-time }
        version: { type: integer, minimum: 0 }
        submittedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    # -- admin: asset cleanup ----------------------------------------------
    CleanupCandidate:
      type: object
      required: [companyId, assetId, fileName, uploadedAt, byteSize]
      additionalProperties: false
      properties:
        companyId: { type: string, format: uuid }
        companyName: { type: [string, 'null'] }
        assetId: { type: string, format: uuid }
        fileName: { type: string }
        objectKey: { type: string }
        uploadedAt: { type: string, format: date-time }
        byteSize: { type: integer, minimum: 0 }
    CleanupPreview:
      type: object
      required: [eligibleImageCount, estimatedBytes, cutoffAt, generatedAt, candidates, remainingImageCount]
      additionalProperties: false
      properties:
        eligibleImageCount: { type: integer, minimum: 0 }
        estimatedBytes: { type: integer, minimum: 0 }
        cutoffAt: { type: string, format: date-time, description: Images older than this instant are eligible. }
        generatedAt: { type: string, format: date-time }
        candidates:
          type: array
          items: { $ref: '#/components/schemas/CleanupCandidate' }
        remainingImageCount: { type: integer, minimum: 0 }
    CleanupPreviewResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/CleanupPreview' }
    CleanupRequest:
      type: object
      required: [assetIds]
      additionalProperties: false
      properties:
        assetIds:
          type: array
          description: Assets to remove. Unreferenced-and-old-enough ones are deleted, everything else is skipped.
          items: { type: string, format: uuid }
    CleanupResult:
      type: object
      required: [removedImageCount]
      additionalProperties: false
      properties:
        removedImageCount: { type: integer, minimum: 0 }
    CleanupResultResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/CleanupResult' }

    # -- admin: marketplace ------------------------------------------------
    CompanyImportCase:
      type: object
      required: [title]
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        area: { type: [number, 'null'], minimum: 0 }
        style: { type: [string, 'null'], maxLength: 80 }
        budget: { type: [number, 'null'], minimum: 0 }
    CompanyImportMaterial:
      type: object
      required: [name, specification, unit, price, category, region, validUntil]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        specification: { type: string, minLength: 1, maxLength: 240 }
        brand: { type: [string, 'null'], maxLength: 120 }
        unit: { type: string, minLength: 1, maxLength: 40 }
        price: { type: number, minimum: 0.01 }
        category: { type: string, minLength: 1, maxLength: 80 }
        region: { type: string, minLength: 1, maxLength: 80 }
        validUntil: { type: string, format: date }
    CompanyImportRequest:
      type: object
      required: [companyName, email, password, contactName, contactInfo, serviceAreas, cases, materials]
      additionalProperties: false
      properties:
        companyName: { type: string, minLength: 1, maxLength: 160 }
        email: { type: string, format: email, maxLength: 320 }
        password: { type: string, minLength: 8, maxLength: 128, writeOnly: true }
        contactName: { type: string, minLength: 1, maxLength: 120 }
        contactInfo: { type: string, minLength: 1, maxLength: 160 }
        city: { type: [string, 'null'], maxLength: 80 }
        services: { type: [string, 'null'], maxLength: 500 }
        intro: { type: [string, 'null'], maxLength: 2000 }
        serviceAreas:
          type: array
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 80 }
        cases:
          type: array
          maxItems: 30
          description: Created as drafts; publish them individually afterwards.
          items: { $ref: '#/components/schemas/CompanyImportCase' }
        materials:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/CompanyImportMaterial' }
    CompanyImportResult:
      type: object
      required: [companyId, email, certificationStatus, caseDrafts, quotes]
      additionalProperties: false
      properties:
        companyId: { type: string, format: uuid }
        email: { type: string }
        certificationStatus: { $ref: '#/components/schemas/CertificationStatus' }
        caseDrafts: { type: integer, minimum: 0 }
        quotes: { type: integer, minimum: 0 }
        firstCaseId: { type: [string, 'null'], format: uuid }
        firstQuoteId: { type: [string, 'null'], format: uuid }
    CompanyImportResultResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/CompanyImportResult' }
    AdminCompanyAsset:
      type: object
      required: [id, fileName, mediaType, uploadedAt, available]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        fileName: { type: string }
        mediaType: { type: string }
        uploadedAt: { type: string, format: date-time }
        available: { type: boolean, description: False when the stored file is missing on disk. }
    AdminCompanyCase:
      type: object
      required: [id, title, status, files, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        area: { type: [number, 'null'] }
        style: { type: [string, 'null'] }
        budget: { type: [number, 'null'] }
        status: { $ref: '#/components/schemas/CaseStatus' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        files:
          type: array
          items: { $ref: '#/components/schemas/AdminCompanyAsset' }
    AdminCompanyMaterial:
      type: object
      required: [id, name, specification, unit, price, category, region, validUntil, hidden, updatedAt, images]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        specification: { type: string }
        brand: { type: [string, 'null'] }
        category: { type: string }
        region: { type: string }
        unit: { type: string }
        price: { type: number }
        validUntil: { type: string, format: date }
        hidden: { type: boolean }
        hiddenReason: { type: [string, 'null'] }
        updatedAt: { type: string, format: date-time }
        images:
          type: array
          items: { $ref: '#/components/schemas/AdminCompanyAsset' }
    AdminCompanyLabor:
      type: object
      required: [type, unit, price, region, validUntil, updatedAt]
      additionalProperties: false
      properties:
        type: { type: string }
        unit: { type: string }
        price: { type: number }
        region: { type: string }
        validUntil: { type: string, format: date }
        updatedAt: { type: string, format: date-time }
    AdminCompanyDetail:
      type: object
      required: [companyId, cases, materialQuotes, laborQuotes, assets]
      additionalProperties: false
      properties:
        companyId: { type: string, format: uuid }
        registeredName: { type: [string, 'null'] }
        accountEmails:
          type: array
          items: { type: string }
        certification:
          anyOf:
            - $ref: '#/components/schemas/CertificationRecord'
            - type: 'null'
        profile:
          anyOf:
            - $ref: '#/components/schemas/CompanyProfile'
            - type: 'null'
        styleProfile:
          anyOf:
            - $ref: '#/components/schemas/CompanyStyleProfile'
            - type: 'null'
        cases:
          type: array
          items: { $ref: '#/components/schemas/AdminCompanyCase' }
        materialQuotes:
          type: array
          items: { $ref: '#/components/schemas/AdminCompanyMaterial' }
        laborQuotes:
          type: array
          items: { $ref: '#/components/schemas/AdminCompanyLabor' }
        assets:
          type: array
          items: { $ref: '#/components/schemas/AdminCompanyAsset' }
    AdminCompanyDetailResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/AdminCompanyDetail' }
    AdminQuote:
      type: object
      required: [id, companyId, name, specification, unit, price, category, region, validUntil, hidden, updatedAt, demo]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        companyId: { type: string, format: uuid }
        companyName: { type: [string, 'null'] }
        certificationStatus: { type: [string, 'null'] }
        name: { type: string }
        specification: { type: string }
        brand: { type: [string, 'null'] }
        category: { type: string }
        region: { type: string }
        unit: { type: string }
        price: { type: number }
        validUntil: { type: string, format: date }
        hidden: { type: boolean }
        hiddenReason: { type: [string, 'null'] }
        updatedAt: { type: string, format: date-time }
        demo: { type: boolean }
    AdminQuotePage:
      type: object
      required: [items, page, size, total, totalPages]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminQuote' }
        page: { type: integer, minimum: 1 }
        size: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
    AdminQuotePageResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/AdminQuotePage' }
    AdminQuoteResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/AdminQuote' }
    MaterialVisibilityRequest:
      type: object
      required: [hidden]
      additionalProperties: false
      properties:
        hidden: { type: boolean }
        reason: { type: [string, 'null'], maxLength: 500 }
    CaseFilesRequest:
      type: object
      required: [fileIds]
      additionalProperties: false
      properties:
        fileIds:
          type: array
          maxItems: 30
          items: { type: string, format: uuid }
    MaterialImagesRequest:
      type: object
      required: [imageIds]
      additionalProperties: false
      properties:
        imageIds:
          type: array
          maxItems: 8
          items: { type: string, format: uuid }

  responses:
    InvalidRequest:
      description: Invalid JSON, type, query, or path parameter
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    ValidationError:
      description: Bean validation failed
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    Unauthorized:
      description: Missing or invalid bearer token
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    Forbidden:
      description: Authenticated principal lacks the required company role
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    NotFound:
      description: Resource does not exist in the current company scope
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    Conflict:
      description: Business uniqueness or natural-key conflict
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    IdempotencyConflict:
      description: Idempotency key was reused with a different request body
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    VersionConflict:
      description: Optimistic concurrency conflict
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    InternalError:
      description: Unexpected server error
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    UnsupportedMediaType:
      description: Uploaded part or request body uses a media type outside the whitelist
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    PayloadTooLarge:
      description: Upload exceeds the 15 MiB per-file limit; error code is FILE_TOO_LARGE
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
