              additionalProperties: true
              properties:
                id: { type: string, format: uuid }
                projectId: { type: string, format: uuid }
                taskType: { type: string, enum: [RENDER, EDIT, RECOMMENDATION] }
                status: { type: string, enum: [QUEUED, RUNNING, SUCCEEDED, FAILED] }
    TaskLeaseRequest:
      type: object
