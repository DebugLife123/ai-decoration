    CertificationRequest:
      type: object
      required: [companyName, contactName, contactInfo, serviceAreas, documentRefs]
      additionalProperties: false
      properties:
        companyName: { type: string, minLength: 1, maxLength: 160 }
        contactName: { type: string, minLength: 1, maxLength: 120 }
        contactInfo: { type: string, minLength: 1, maxLength: 160 }
        serviceAreas: { type: array, maxItems: 20, items: { type: string, minLength: 1, maxLength: 80 } }
        documentRefs: { type: array, maxItems: 30, items: { type: string, minLength: 1, maxLength: 2000 } }
        version: { type: integer, minimum: 0, description: Required when updating an existing application. }
    CertificationDecision:
      type: object
      required: [status, version]
      additionalProperties: false
      properties:
        status: { type: string, enum: [APPROVED, REJECTED] }
        reviewNote: { type: [string, 'null'], maxLength: 1000 }
        version: { type: integer, minimum: 0 }
    CertificationResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data:
              anyOf:
                - type: object
                  required: [id, companyName, contactName, contactInfo, serviceAreas, documentRefs, status, version, submittedAt, updatedAt]
                  additionalProperties: false
                  properties:
                    id: { type: string, format: uuid }
                    companyName: { type: string }
                    contactName: { type: string }
                    contactInfo: { type: string }
                    serviceAreas: { type: array, items: { type: string } }
                    documentRefs: { type: array, items: { type: string } }
                    status: { type: string, enum: [PENDING, APPROVED, REJECTED] }
                    reviewNote: { type: [string, 'null'] }
                    reviewedBy: { type: [string, 'null'], format: uuid }
                    reviewedAt: { type: [string, 'null'], format: date-time }
                    version: { type: integer, minimum: 0 }
                    submittedAt: { type: string, format: date-time }
                    updatedAt: { type: string, format: date-time }
                - type: 'null'
    ApiEnvelope:
      type: object
      required: [code, message, data, timestamp]
      additionalProperties: false
      properties:
        code: { type: string, example: OK }
        message: { type: string, example: success }
        data: {}
        timestamp: { type: string, format: date-time }
    ErrorResponse:
      type: object
      required: [code, message, data, timestamp]
      additionalProperties: false
      properties:
        code:
          type: string
          enum: [INVALID_REQUEST, VALIDATION_ERROR, UNAUTHORIZED, FORBIDDEN, NOT_FOUND, CONFLICT, IDEMPOTENCY_CONFLICT, VERSION_CONFLICT, UNSUPPORTED_MEDIA_TYPE, INTERNAL_ERROR]
        message: { type: string, maxLength: 500 }
        data: { type: 'null' }
        timestamp: { type: string, format: date-time }
    PageMeta:
      type: object
