workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never

stages:
  - verify
  - deploy

variables:
  COMPOSE_PROJECT_NAME: wyx-decoration
  DOCKER_BUILDKIT: "1"
  COMPOSE_DOCKER_CLI_BUILD: "1"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

verify:
  stage: verify
  tags:
    - dockerlab-windows
  script:
    - npm ci --prefer-offline
    - npm run lint
    - npm run build
    - |
      $env:POSTGRES_PASSWORD = 'ci-compose-config-validation-only'
      $env:JWT_SECRET = 'ci-compose-config-validation-only'
      docker compose -p $env:COMPOSE_PROJECT_NAME config --quiet
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      Remove-Item Env:POSTGRES_PASSWORD,Env:JWT_SECRET -ErrorAction SilentlyContinue
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

deploy_production:
  stage: deploy
  tags:
    - dockerlab-windows
  needs:
    - job: verify
  resource_group: decoration-production
  environment:
    name: production
    url: http://www.openai2api.com:4175/
  script: |
    $sourceDeploymentPath = 'D:/wyx/decoration-main-deploy'
    $releaseRoot = 'D:/wyx/decoration-releases'
    $releasePath = Join-Path $releaseRoot $env:CI_COMMIT_SHA
    $sourceBaseComposeFile = Join-Path $env:CI_PROJECT_DIR 'docker-compose.yml'
    $sourceComposeFile = Join-Path $sourceDeploymentPath '.docker-compose.integration.yml'
    $sourceEnvFile = Join-Path $sourceDeploymentPath '.env'
    if (-not (Test-Path -LiteralPath $sourceBaseComposeFile -PathType Leaf)) { throw "Production base compose file not found: $sourceBaseComposeFile" }
    if (-not (Test-Path -LiteralPath $sourceComposeFile -PathType Leaf)) { throw "Production compose file not found: $sourceComposeFile" }
    if (-not (Test-Path -LiteralPath $sourceEnvFile -PathType Leaf)) { throw "Production environment file not found: $sourceEnvFile" }
    New-Item -ItemType Directory -Path $releaseRoot -Force | Out-Null
    if (Test-Path -LiteralPath $releasePath) {
      $resolvedReleasePath = [IO.Path]::GetFullPath($releasePath).TrimEnd('/')
      if ($resolvedReleasePath -ne ([IO.Path]::GetFullPath((Join-Path $releaseRoot $env:CI_COMMIT_SHA)).TrimEnd('/'))) { throw "Refusing to remove unexpected release path: $resolvedReleasePath" }
      Remove-Item -LiteralPath $releasePath -Recurse -Force
    }
    New-Item -ItemType Directory -Path $releasePath -Force | Out-Null
    Copy-Item -LiteralPath $sourceBaseComposeFile -Destination (Join-Path $releasePath 'docker-compose.yml') -Force
    Copy-Item -LiteralPath $sourceComposeFile -Destination (Join-Path $releasePath '.docker-compose.integration.yml') -Force
    Copy-Item -LiteralPath $sourceEnvFile -Destination (Join-Path $releasePath '.env') -Force
    $baseComposeFile = Join-Path $releasePath 'docker-compose.yml'
    $composeFile = Join-Path $releasePath '.docker-compose.integration.yml'
    $composeArgs = @('--env-file', (Join-Path $releasePath '.env'), '--project-directory', $releasePath, '-p', 'wyx-decoration-integration', '-f', $baseComposeFile, '-f', $composeFile)
    $env:IMAGE_TAG = "wyx-decoration:$env:CI_COMMIT_SHA"
    $env:BACKEND_IMAGE = "wyx-decoration-backend:$env:CI_COMMIT_SHA"
    docker build --tag $env:IMAGE_TAG $env:CI_PROJECT_DIR
    if ($LASTEXITCODE -ne 0) { throw "Frontend build failed." }
    docker build --tag $env:BACKEND_IMAGE (Join-Path $env:CI_PROJECT_DIR 'backend')
    if ($LASTEXITCODE -ne 0) { throw "Backend build failed." }
    $env:DECORATION_IMAGE = $env:IMAGE_TAG
    docker compose @composeArgs config --quiet
    if ($LASTEXITCODE -ne 0) { throw "Docker Compose configuration validation failed." }
    docker compose @composeArgs up -d --no-build --no-deps --wait backend
    if ($LASTEXITCODE -ne 0) { throw "Backend readiness failed." }
    docker compose @composeArgs up -d --no-build --no-deps --wait decoration
    if ($LASTEXITCODE -ne 0) { throw "Gateway readiness failed." }
    $response = Invoke-RestMethod -Uri 'http://127.0.0.1:4175/api/v1/health' -TimeoutSec 10
    if ($response.data.status -ne 'UP') { throw "Application health failed." }
    $runningImage = docker inspect wyx-decoration-integration-decoration-1 --format '{{.Config.Image}}'
    if ($runningImage -ne $env:IMAGE_TAG) { throw "Unexpected running image: $runningImage" }
    $policy = docker inspect wyx-decoration-integration-decoration-1 --format '{{.HostConfig.RestartPolicy.Name}}'
    if ($policy -ne "unless-stopped") { throw "Unexpected restart policy: $policy" }
    docker compose @composeArgs ps
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
