workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never

stages:
  - verify
  - deploy

variables:
  COMPOSE_PROJECT_NAME: wyx-decoration
  DOCKER_BUILDKIT: "1"
  COMPOSE_DOCKER_CLI_BUILD: "1"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

# 前端：lint + 类型检查 + 构建 + compose 语法校验
verify_frontend:
  stage: verify
  tags:
    - dockerlab-windows
  script:
    - npm ci --prefer-offline
    - npm run lint
    - npx tsc -b
    - npm run build
    # compose 里 JWT_SECRET 用了 ${JWT_SECRET:?...} 必填语法，这里给个占位值只为校验语法
    - $env:JWT_SECRET = 'ci-syntax-check-only'
    - docker compose -p $env:COMPOSE_PROJECT_NAME config --quiet
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# 后端：直接在 runner 主机上跑 mvn test（含 2 个直连 PostgreSQL 的集成测试）。
#
# 这里不再用 maven 容器跑测试：runner 拉不到 docker.io 上的 maven 镜像（EOF），
# 「能不能跑测试」不应该被「能不能拉镜像」绑架。现在只剩一个 postgres 镜像，
# 而它是长期缓存的。
#
# JDK 由 scripts/ensure-jdk21.ps1 现找现装：runner 主机历史上没装 Java
# （日志里 `java -version` 报「术语 'java' 不是 cmdlet」，job 20 秒就挂了）。
# 与其等运维去装，不如让任务自己准备：脚本先找 PATH / JAVA_HOME / 常见安装目录，
# 都没有就下一个 Adoptium 21 解压到 %LOCALAPPDATA%\dsh\jdk21，装一次所有流水线共用。
# Maven 不需要预装：backend/mvnw.cmd 是 Maven Wrapper，会自己下载并固定使用 3.9.9。
# 这样 runner 的 JDK/Maven 版本都不再是变量，本地和 CI 跑的是同一套。
#
# 端口按原样用 5432。若 runner 上已有 PostgreSQL 占着 5432，把
# backend/docker-compose.test.yml 的映射改成 55432 并同步改这里的 DATABASE_TEST_URL。
#
# 集成测试读 DATABASE_TEST_URL / DATABASE_TEST_USERNAME / DATABASE_TEST_PASSWORD，
# 这里显式给值，不依赖测试代码里的默认值。
# 每个测试类在自己的随机 schema 里跑完整 Flyway 迁移，与同机上的长期库互不干扰。
verify_backend:
  stage: verify
  tags:
    - dockerlab-windows
  timeout: 30m
  variables:
    DATABASE_TEST_URL: jdbc:postgresql://localhost:5432/decoration
    DATABASE_TEST_USERNAME: decoration
    DATABASE_TEST_PASSWORD: decoration
    # 把本地仓库指到工作区里，这样 .m2 才能被下面的 cache 带走；
    # 默认的 ~/.m2 在项目目录外，GitLab 的 cache 抓不到。
    MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/backend/.m2"
  script:
    # 拿到 JDK 21：脚本只把路径打在标准输出上，进度信息走信息流不会串进来。
    - |
      $ErrorActionPreference = 'Stop'
      $jdk = & "$env:CI_PROJECT_DIR\scripts\ensure-jdk21.ps1"
      if (-not $jdk -or -not (Test-Path -LiteralPath (Join-Path $jdk 'bin\java.exe'))) {
        throw "ensure-jdk21.ps1 没有返回可用的 JDK 路径（返回的是：'$jdk'）"
      }
      $env:JAVA_HOME = $jdk
      $env:PATH = "$env:JAVA_HOME\bin;$env:PATH"
      Write-Host "JAVA_HOME = $env:JAVA_HOME"
      & "$env:JAVA_HOME\bin\java.exe" -version
    - |
      # 先把测试库拉起来，再跑测试。失败要立刻停，不要带着没有数据库的状态往下跑。
      #
      # 先清掉悬空网络：runner 的 daemon 上默认地址池曾被历史网络切光，
      # 报 "all predefined address pools have been fully subnetted"，连网络都建不出来。
      # 清掉已失联的（非 running 容器在用的）网络，再由 compose 用固定子网重建。
      docker network prune --force | Out-Host
      docker compose -p wyx-decoration-test -f backend/docker-compose.test.yml up -d --wait
      if ($LASTEXITCODE -ne 0) {
        # 起不来时把现场打出来：网络列表能直接看出地址池还剩多少，日志里也能看到容器状态。
        docker network ls | Out-Host
        docker compose -p wyx-decoration-test -f backend/docker-compose.test.yml ps | Out-Host
        throw "测试用 PostgreSQL 启动失败。"
      }
    - |
      # mvnw.cmd 会从当前目录往上找 .mvn 目录，所以在仓库根目录直接调用
      # backend\mvnw.cmd 是找不到 backend/.mvn/wrapper/maven-wrapper.properties 的
      # （实测报：The system cannot find the file ...\.mvn\wrapper\maven-wrapper.properties）。
      # 进到 backend 目录里跑，比设 MAVEN_BASEDIR 更不容易出错。
      Push-Location backend
      try {
        .\mvnw.cmd -B test
        if ($LASTEXITCODE -ne 0) { throw "后端测试失败（mvn 退出码 $LASTEXITCODE）" }
      } finally {
        Pop-Location
      }
  after_script:
    - docker compose -p wyx-decoration-test -f backend/docker-compose.test.yml down --volumes --remove-orphans
  artifacts:
    when: on_failure
    expire_in: 1 week
    paths:
      - backend/target/surefire-reports/
  cache:
    # 覆盖全局 cache（job 级 cache 不与全局合并）：后端任务不需要 .npm。
    # 只缓存 Maven 本地仓库；JDK 装在 %LOCALAPPDATA%\dsh\jdk21 下，
    # 那是 runner 的持久目录，装一次所有流水线共用，不用每次搬 300MB。
    # key 用 backend/pom.xml 而不是 package-lock.json：前端改依赖时后端缓存不该失效。
    key:
      files:
        - backend/pom.xml
    paths:
      - backend/.m2/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  allow_failure: false

deploy_production:
  stage: deploy
  tags:
    - dockerlab-windows
  needs:
    - job: verify_frontend
    - job: verify_backend
  resource_group: decoration-production
  environment:
    name: production
    url: http://www.openai2api.com:4175/
  script: |
    $deploymentPath = 'D:/wyx/decoration'
    if (-not (Test-Path -LiteralPath (Join-Path $deploymentPath '.git'))) { throw "Deployment directory is not a Git checkout: $deploymentPath" }
    if ((git -C $deploymentPath branch --show-current) -ne 'main') { throw "Deployment directory is not on main; refusing to deploy." }
    if ((git -C $deploymentPath remote get-url origin) -ne 'http://192.168.6.78/wyxgroup/decoration.git') { throw "Deployment directory origin does not match this project." }
    if (git -C $deploymentPath status --porcelain --untracked-files=normal) { throw "Deployment directory has local changes; refusing to overwrite them." }
    $env:GIT_CONFIG_COUNT = '1'
    $env:GIT_CONFIG_KEY_0 = 'http.extraHeader'
    $env:GIT_CONFIG_VALUE_0 = "JOB-TOKEN: $env:CI_JOB_TOKEN"
    try {
      git -C $deploymentPath fetch origin $env:CI_COMMIT_SHA
      if ($LASTEXITCODE -ne 0) { throw "Could not fetch this pipeline commit into the deployment directory." }
      git -C $deploymentPath merge --ff-only FETCH_HEAD
      if ($LASTEXITCODE -ne 0) { throw "Deployment directory cannot fast-forward to this pipeline commit." }
      $deployedSha = git -C $deploymentPath rev-parse HEAD
      if ($deployedSha -ne $env:CI_COMMIT_SHA) { throw "Deployment directory is not at the pipeline commit after synchronization." }
    } finally {
      Remove-Item Env:GIT_CONFIG_COUNT,Env:GIT_CONFIG_KEY_0,Env:GIT_CONFIG_VALUE_0 -ErrorAction SilentlyContinue
    }
    Set-Location -LiteralPath $deploymentPath
    $composeArgs = @('--project-directory', $deploymentPath, '-p', $env:COMPOSE_PROJECT_NAME, '-f', (Join-Path $deploymentPath 'docker-compose.yml'))
    # 生产密钥与来源白名单必须由 CI/CD 变量提供，不再有硬编码默认值
    if (-not $env:JWT_SECRET) { throw "JWT_SECRET CI/CD variable is required." }
    if (-not $env:VITE_BUSINESS_API_URL) { throw "VITE_BUSINESS_API_URL CI/CD variable is required (frontend bundles it at build time)." }
    docker compose @composeArgs config --quiet
    if ($LASTEXITCODE -ne 0) { throw "Docker Compose configuration validation failed." }
    docker compose @composeArgs up -d --build
    if ($LASTEXITCODE -ne 0) { throw "Docker Compose could not start the production stack." }
    $healthy = $false
    for ($attempt = 1; $attempt -le 36; $attempt++) {
      try {
        $response = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:4175/" -TimeoutSec 5
        if ([int]$response.StatusCode -eq 200) { $healthy = $true; break }
      } catch {}
      Start-Sleep -Seconds 5
    }
    if (-not $healthy) { docker compose @composeArgs ps; docker compose @composeArgs logs --tail 120; throw "Production health check failed." }
    docker compose @composeArgs ps
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
