services:
  postgres:
    image: postgres:16-alpine
    container_name: decoration-postgres
    environment:
      POSTGRES_DB: decoration
      POSTGRES_USER: decoration
      POSTGRES_PASSWORD: decoration
    ports:
      - "5432:5432"
    volumes:
      - decoration-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U decoration -d decoration"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  decoration-postgres-data:
