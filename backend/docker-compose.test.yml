# 仅供 CI 与本地校验后端测试使用：一个临时 postgres + 一个 maven 容器。
# 用法：
#   docker compose -f backend/docker-compose.test.yml up --abort-on-container-exit --exit-code-from backend-test
#   docker compose -f backend/docker-compose.test.yml down -v
#
# 与 backend/docker-compose.yml 的区别：那份只起本机开发用的 postgres（端口 5432 映射到宿主），
# 这份不起端口，测试容器直接通过服务名连库，用完即销毁。
services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: decoration
      POSTGRES_USER: decoration
      POSTGRES_PASSWORD: decoration
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U decoration -d decoration"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend-test:
    image: maven:3.9-eclipse-temurin-21
    working_dir: /build
    depends_on:
      postgres-test:
        condition: service_healthy
    environment:
      # 集成测试读这两个变量决定连哪个库（见 BudgetEstimateIntegrationTest / BusinessDataPostgresIntegrationTest）
      DATABASE_TEST_URL: jdbc:postgresql://postgres-test:5432/decoration
      DATABASE_TEST_USERNAME: decoration
      DATABASE_TEST_PASSWORD: decoration
      MAVEN_OPTS: -Dmaven.repo.local=/m2
    volumes:
      - ./:/build
      - m2-cache:/m2
    command: ["mvn", "-B", "test"]

volumes:
  m2-cache:
