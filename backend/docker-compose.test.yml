# 仅供 CI 使用的临时 postgres：验证任务在 runner 主机上直接跑 mvn test，
# 不再用 maven 容器。
#
# 为什么去掉 maven 容器：runner 连不上 Docker Hub，拉
# maven:3.9-eclipse-temurin-21 会 EOF 失败，导致「能不能跑测试」被
# 「能不能拉镜像」绑架。现在只剩一个 postgres 镜像依赖，且它是长期缓存的。
#
# 端口映射：同机若已有 PostgreSQL 占着 5432，把左边的 5432 改成 55432，
# 并同步改 .gitlab-ci.yml 里的 DATABASE_TEST_URL。默认按原样保留。
services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: decoration
      POSTGRES_USER: decoration
      POSTGRES_PASSWORD: decoration
    ports:
      - "5432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U decoration -d decoration"]
      interval: 3s
      timeout: 3s
      retries: 20
