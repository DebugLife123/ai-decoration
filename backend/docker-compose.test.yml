# 仅供 CI 使用的临时 postgres：验证任务在 runner 主机上直接跑 mvn test，
# 不再用 maven 容器。
#
# 为什么去掉 maven 容器：runner 连不上 Docker Hub，拉
# maven:3.9-eclipse-temurin-21 会 EOF 失败，导致「能不能跑测试」被
# 「能不能拉镜像」绑架。现在只剩一个 postgres 镜像依赖，且它是长期缓存的。
#
# 端口映射：同机若已有 PostgreSQL 占着 5432，把左边的 5432 改成 55432，
# 并同步改 .gitlab-ci.yml 里的 DATABASE_TEST_URL。默认按原样保留。
#
# 镜像名默认用不带前缀的 postgres:16-alpine —— runner 上这个镜像已长期缓存，
# 不需要联网。如果哪天缓存被清掉、而 runner 又连不上 Docker Hub，把
# POSTGRES_TEST_IMAGE 设成 docker.m.daocloud.io/library/postgres:16-alpine
# （该代理已验证可拉）即可，不必改文件。
services:
  postgres-test:
    image: ${POSTGRES_TEST_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_DB: decoration
      POSTGRES_USER: decoration
      POSTGRES_PASSWORD: decoration
    ports:
      - "5432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U decoration -d decoration"]
      interval: 3s
      timeout: 3s
      retries: 20

# runner 的 Docker 默认地址池被占满过：
#   04 (decimal) 4049842243: Network wyx-decoration-test_default Error
#   "all predefined address pools have been fully subnetted"
# 那是 daemon 里默认的 /16 池被历史网络切光了，不指定子网就分不出地址。
# 这里显式给一个小网段，绕开默认池；子网选得偏僻一些，避免和别的网络撞车。
# 配套地，CI 在 up 之前会先 docker network prune 清掉失联网络（见 .gitlab-ci.yml）。
networks:
  default:
    ipam:
      config:
        - subnet: 10.213.7.0/24
