# Maven Wrapper 配置。
#
# 为什么用 wrapper：CI runner（DESKTOP-9MKJM31）不一定装了 Maven，但有 JDK 21。
# wrapper 让「跑测试」只依赖 JDK，Maven 版本由项目自己钉住，不随 runner 环境影响。
#
# distributionUrl 固定到 3.9.9：项目在 3.9 上验证过。
#
# 注意 URL 里的双斜杠是镜像默认的写法，保持即可；版本号必须写全，写成 3 会解析成
# apache-maven-3-bin.zip 这个不存在的文件（mvn wrapper:wrapper 的 -Dmaven 参数有坑）。
#
# 走腾讯云镜像而不是 apache.org：runner 访问公网不稳定（拉 docker.io 镜像已因 EOF 失败过）。
# 若 runner 能直连公网，可换回官方地址：
#   https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.9/apache-maven-3.9.9-bin.zip
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.9/apache-maven-3.9.9-bin.zip
wrapperUrl=http://mirrors.cloud.tencent.com/nexus/repository/maven-public/org/apache/maven/wrapper/maven-wrapper/3.3.2/maven-wrapper-3.3.2.jar
