spring:
  application:
    name: decoration-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/decoration}
    username: ${DATABASE_USERNAME:decoration}
    password: ${DATABASE_PASSWORD:decoration}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 16MB

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

app:
  storage:
    local-dir: ${APP_UPLOAD_DIR:./var/uploads}
  security:
    jwt-secret: ${JWT_SECRET:local-development-secret-change-before-deployment-32-bytes-minimum}
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:4173,http://127.0.0.1:4173,http://localhost:4175,http://127.0.0.1:4175,http://localhost:5177,http://127.0.0.1:5177,http://www.openai2api.com:4175,https://www.openai2api.com:4175,http://192.168.6.78:4175}
  admin:
    bootstrap:
      enabled: ${ADMIN_BOOTSTRAP_ENABLED:false}
      email: ${ADMIN_BOOTSTRAP_EMAIL:}
      password: ${ADMIN_BOOTSTRAP_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    version: 0.1.0-SNAPSHOT
