spring:
  application:
    name: decoration-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/decoration}
    username: ${DATABASE_USERNAME:decoration}
    password: ${DATABASE_PASSWORD:decoration}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 16MB

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

app:
  storage:
    local-dir: ${APP_UPLOAD_DIR:./var/uploads}
    # 单个上传文件上限。必须与下面的 spring.servlet.multipart.max-file-size 保持一致，
    # 否则超限文件会先被 multipart 层拒掉，业务层白名单校验根本来不及跑。
    max-file-size-bytes: ${APP_MAX_FILE_SIZE_BYTES:15728640}
  security:
    jwt-secret: ${JWT_SECRET:local-development-secret-change-before-deployment-32-bytes-minimum}
  admin:
    bootstrap:
      enabled: ${ADMIN_BOOTSTRAP_ENABLED:false}
      email: ${ADMIN_BOOTSTRAP_EMAIL:}
      password: ${ADMIN_BOOTSTRAP_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    version: 0.1.0-SNAPSHOT
