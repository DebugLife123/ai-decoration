spring:
  flyway:
    enabled: true

# 生产环境只暴露健康探针，不暴露 info / env / beans 等可枚举信息的端点。
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

app:
  # 生产必须通过环境变量注入；下面的空默认值会让启动直接失败，避免误用开发密钥。
  security:
    jwt-secret: ${JWT_SECRET}
    # 浏览器来源白名单，逗号分隔。未配置时仅允许同源部署（前端与后端同一域名）。
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  admin:
    bootstrap:
      enabled: false
